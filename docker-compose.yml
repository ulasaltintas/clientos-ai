
services:
  db:
    image: postgres:17
    container_name: clientos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: clientos
      POSTGRES_PASSWORD: clientos_dev_password
      POSTGRES_DB: clientos_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientos -d clientos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
